# The letter at the front of the binder. Names are left out on purpose (the site is public).
title: A Note from Mom and Dad
link: A note from Mom & Dad
order: 1
body: |
  Hi Kids,

  These are recipes that should be kept for posterity. Many are Dad's and go back to the seventies (written in his own terrible handwriting); some are Mom's and are heritage recipes; [one of your grandmothers] is represented. A couple are written by the hand of [two of your grandmothers] (it's a recipe from your great great grandmother).

  Adaptations from a variety of sources are now recipes that Dad has taken ownership of…and refuses to give back. Some, however, we have developed on our own through trial and error. When you were kids, you probably ate at least a few of the errors. They couldn't have been too bad as you lived through them. A lot of these recipes come with funny stories that can be told around the campfire, at a family dinner or in the emergency room.

  There's a recipe from The Italia, published in Metroland, from before you were born. It was one of your Mom's absolute favorites. The Alehouse Cake is here in all its delicious glory. We've included entrees, desserts and particularly cookies that were obviously taken right from the internet, great chefs and magazines (remember magazines?). They were so good and often so unique that they should [be] made and savored on occasion.

  Breaking bread and enjoying good food around a table of family and friends was always our joy and, to some extent, that tie that binds us together. Eat, drink and be merry.

  Love, Mom and Dad
outro: "Mentioned in the letter: [[veal-piemontese]] and [[alehouse-chocolate-macadamia-ganache-cake]]."
