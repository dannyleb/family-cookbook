title: Essay on Beer and Wine
link: Essay on beer & wine
order: 2
intro: One of the kids asked Dad for help with a list of classy beverages. This was his answer (December 2007).
body: |
  ## The question

  I am trying to compile a list of classy beverages for one of my philistine friends who is trying to broaden his horizons, and I have my preferences but I'm trying to get input from other people so it's not biased. So here's what I need:

  List your absolute favorite beer types…not brands, but styles: Dark, pale, IPA, wheat…? etc. List a few for me

  List your absolute favorite wines, now for these, they can be types (chard, cabernet, etc.) OR specific brands if you can think of them (pricing doesn't matter). List a few of those

  Thanks Da!

  ## Dad's answer

  My favorite types of beer – cold and not so cold. Really, I like porters (very dark and very hoppy but not as thick and pungent as stouts – the Brooklyn Brewery makes a great porter) and I like dark English ales (think Newcastle Ale – which should be served closer to room temp), I like lager styles for hot summer days – Heinies, Corona. There are lots of micro-brews in New England that have twists on classic brewing styles – Otter Creek Copper Ale for instance. For a special treat, a Belgium Lambic is very neato – usually has a subtle fruit undertone (raspberry is popular). It is complex and must be sipped sparingly as it has a higher alcohol content.

  WINE! – Now your talking – the greatest wines anywhere are French – don't let the neo-hippies from California tell you otherwise. Your Mom and I had a nine dollar Bordeaux last night that was better than ANYTHING made in California. Oh, and New York has taxes, strawberries and corn but what comes from the vineyards is only wine in the academic sense – it was made from grapes, it's in bottles, that's about it.

  My order of preference –

  Cote Du Rhone – this is a region. THE region. Deep, rich, earthy but usually a little lighter than Bordeaux. God put his thumb in this valley and said, “blessed and best” Ask a knowledgeable wine store – An entry level (cheap) Rhone can be 10 or 12 bucks and well worth it. My particular favorite house is Crozes-Hermitage, which, depending on the vintage can set you back 25 to well over a hundred bucks – I once had half a case of the 78 – which many people called “Wine of the Century” It was scrumpulencent. A very recognizable name from the Rhone valley is Chateaunef De Pape.

  Bordeaux – can't go wrong. 'Grand Cru' is a classification of the “first or great growth” and most vineyards will have a Grand Cru that will set you back quite some euros. However, a knowledgeable shop should be able to steer one to some excellent houses and vintages for a bottle in the 25. range. Truly, though, a 12 dollar Bordeaux is usually pretty good. I really like white Bordeaux for cocktail time and with chicken and not too delicate seafood and fish.

  Very close to white Bordeaux but a little crisper, lighter with more fruit is the old standby – Pinot Grisio from Italy. Great summer wine – BUT don't be fooled into buying the cheap versions (7, 8 bucks a bottle) – they're usually crappy. Marguerite is a brand of Pinto Grisio that, for a few dollars more, is really worth it. I also like good Chianti – bold, assertive, great with Italian food – but the same thing applies – get a decent one.

  If you must consider California wine – get a Pinot Noir – ask for help – don't spend more than 20 dollars.

  If you must consider wines from Germany, Australia, South Africa or Argentina – throw yourself in front of a fast bus.

  Like many things, wine prices have a diminishing return: a bottle of wine under 10 bucks is usually awful or, at best, below OK (with rare exceptions). There are terrific wines in the $15–25 range but then, as you get into great houses and vintages and start to creep toward 50. or more, the average (or even above average) oenophile will not taste the difference in a dramatic way.

  Love, Wine Snob Daddy
