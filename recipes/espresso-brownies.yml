title: Espresso Brownies
category: Desserts
from: Sample recipe
serves: One 8x8-in pan
time: 50 min
tags: [chocolate, coffee, baking]
description: Fudgy brownies with a shot of espresso.

before:
  - Butter and flour an 8x8-in pan
  - Preheat oven to 350°F (170°C)

ingredients:
  - butter: 4 oz (115 g) unsalted butter
  - sugar: 1 cup (200 g) sugar
  - vanilla: 1/4 tsp. (2.5 mL) vanilla extract
  - espresso: 1 shot (4 Tbs; 60 mL) fresh brewed espresso or very strong coffee
  - eggs: 2 large (100 g) eggs
  - flour: 1/2 cup (80 g) all-purpose flour
  - cocoa: 1/3 cup (80 g) Hershey's cocoa powder
  - soda: 1/4 tsp. (1.3 g) baking soda
  - salt: 1/4 tsp. (1.5 g) table salt

steps:
  - action: melt
    uses: [butter]
    text: Melt the butter.
  - action: mix
    uses: [previous, sugar, vanilla, espresso]
    text: Mix in the sugar, vanilla, and espresso.
  - action: mix
    uses: [previous, eggs]
    text: Mix in the eggs.
  - action: fold in
    uses: [previous, flour, cocoa, soda, salt]
    text: Fold in the flour, cocoa powder, baking soda, and salt until just combined.
  - action: bake 350°F (170°C) 30 to 40 min
    uses: [previous]
    text: Pour into the prepared pan and bake at 350°F (170°C) for 30 to 40 minutes.

notes: |
  The source lists 80 g for 1/3 cup of cocoa. 1/3 cup of cocoa powder weighs closer
  to 30 g, so go by the cup measure.
